<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https: http:; font-src 'self' data:; media-src 'self' file: data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none';"
  />
  <title>BetterThanChatbox</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <div class="brand">
          <span class="brand-dot"></span>
          <span>BetterThanChatbox</span>
        </div>
        <div class="side-actions">
          <button id="btn-new" class="primary-btn">＋ 新建对话</button>
          <button id="btn-import" class="ghost-btn" title="从导出的 JSON / Markdown 或整库备份里导入对话">⬆ 导入</button>
        </div>
      </div>
      <div id="conv-list" class="conv-list"></div>
      <div class="side-foot">
        <button id="btn-settings" class="ghost-btn block">⚙ 设置</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <input id="conv-title" class="conv-title" placeholder="对话名称" spellcheck="false" />
        <div class="topbar-right">
          <select id="conn-select" class="mini-select" title="使用的接口"></select>
          <div id="model-picker" class="model-picker"></div>
          <button id="btn-theme" class="icon-btn" title="切换主题">🌙</button>
          <button id="btn-conv-params" class="ghost-btn" title="本对话的系统提示词 / 温度">⚙ 参数</button>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <div class="composer-wrap">
        <div id="path-chips" class="path-chips hidden"></div>
        <div id="pending" class="pending hidden"></div>
        <div id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="输入消息…  Enter 发送，Shift+Enter 换行&#10;可拖入或粘贴图片 / 文件，也可以直接粘一个本地路径（如 D:\项目A）"></textarea>
          <div class="composer-bar">
            <button id="btn-attach" class="icon-btn" title="添加图片或文件">📎 添加附件</button>
            <span class="hint" id="hint"></span>
            <button id="btn-send" class="primary-btn">发送</button>
          </div>
        </div>
        <div class="composer-tip">Enter 发送 · Shift+Enter 换行 · 支持拖拽/粘贴文件 · 粘一个文件夹路径可以让 AI 读里面的文档 · 图片会以视觉方式发送</div>
      </div>

      <!-- 上下文「灵动岛」：放在输入框下面，平时就是一个小胶囊，点一下才展开详情 -->
      <div id="ctx-island" class="ctx-island hidden"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="drop-overlay" class="drop-overlay hidden"><div class="drop-inner">松开鼠标以添加文件</div></div>
  <div id="modal-root"></div>

  <script src="app.js"></script>
</body>
</html>
